spring:
  datasource:
    url:      jdbc:postgresql://localhost:5432/financas
    username: financas_user
    password: financas_pass
    hikari:
      maximum-pool-size:    10
      minimum-idle:          2
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:      1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql:       true
        default_schema:   public
        jdbc:
          batch_size: 25
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:9a4f2c3d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0d1e2f}
  expiration: ${JWT_EXPIRATION:3600000}