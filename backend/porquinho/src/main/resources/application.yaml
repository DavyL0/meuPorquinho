spring:
  datasource:
    # Em producao, defina DB_URL, DB_USER e DB_PASSWORD como variaveis de ambiente.
    # Os valores padrao abaixo existem apenas para desenvolvimento local (docker-compose).
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/financas}
    username: ${DB_USER:financas_user}
    password: ${DB_PASSWORD:financas_pass}
    hikari:
      maximum-pool-size:    10
      minimum-idle:          2
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:      1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql:       true
        default_schema:   public
        jdbc:
          batch_size: 25
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # ATENCAO: esta chave padrao serve APENAS para desenvolvimento local.
  # Em qualquer ambiente real, defina a variavel de ambiente JWT_SECRET
  # (Base64 com pelo menos 64 bytes de entropia).
  secret: ${JWT_SECRET:b6VkMcjo9+cs6WX7yhWHGjJ863bbklUMwx+plGj+6u8NcgkEZsYDG5Jqi36SRkpRAvuESptNYwXfQrt9UIj87Q==}
  expiration: ${JWT_EXPIRATION:3600000}
