spring:
  datasource:
    # Credenciais de desenvolvimento local (mesmas do docker-compose).
    # Em produção, sobrescreva via variáveis de ambiente.
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/financas}
    username: ${DB_USERNAME:financas_user}
    password: ${DB_PASSWORD:financas_pass}
    hikari:
      maximum-pool-size:    10
      minimum-idle:          2
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:      1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql:       true
        default_schema:   public
        jdbc:
          batch_size: 25
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # OBRIGATÓRIO: defina a variável de ambiente JWT_SECRET (Base64).
  # Gere uma com: openssl rand -base64 48
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}