spring:
  datasource:
    # Credenciais de desenvolvimento local (mesmas do docker-compose).
    # Em produção, sobrescreva via variáveis de ambiente.
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/financas}
    username: ${DB_USERNAME:financas_user}
    password: ${DB_PASSWORD:financas_pass}
    hikari:
      maximum-pool-size:    10
      minimum-idle:          2
      connection-timeout: 30000
      idle-timeout:       600000
      max-lifetime:      1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql:       true
        default_schema:   public
        jdbc:
          batch_size: 25
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    # Sem MAIL_HOST configurado, os e-mails são apenas registrados em log.
    host:     ${MAIL_HOST:}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  # OBRIGATÓRIO: defina a variável de ambiente JWT_SECRET (Base64).
  # Gere uma com: openssl rand -base64 48
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}

monitoramento:
  # Intervalo entre verificações de cotação (padrão: 60s)
  intervalo-ms:        ${MONITORAMENTO_INTERVALO:60000}
  atraso-inicial-ms:   ${MONITORAMENTO_ATRASO_INICIAL:15000}

app:
  mail-from: ${MAIL_FROM:Porquinho <no-reply@porquinho.local>}

jwt:
  # OBRIGATÓRIO: defina a variável de ambiente JWT_SECRET (Base64).
  # Gere uma com: openssl rand -base64 48
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}