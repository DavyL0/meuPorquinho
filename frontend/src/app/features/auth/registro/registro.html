<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <span class="logo-icon">
        <svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px">
          <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/>
          <path d="M2 9v1c0 1.1.9 2 2 2h1"/>
          <path d="M16 11h.01"/>
        </svg>
      </span>
      <h1>Porquinho</h1>
      <p>Crie sua conta gratuita</p>
    </div>

    @if (erro()) {
      <div class="alert-error">{{ erro() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="registrar()">

      <div class="field">
        <label>Nome</label>
        <input formControlName="nome"
               type="text"
               placeholder="Seu nome"
               [class.input-error]="invalido('nome')"/>
        @if (invalido('nome')) {
          <span class="field-error">Informe seu nome (mínimo 2 caracteres).</span>
        }
      </div>

      <div class="field">
        <label>E-mail</label>
        <input formControlName="email"
               type="email"
               placeholder="seu@email.com"
               [class.input-error]="invalido('email')"/>
        @if (invalido('email')) {
          <span class="field-error">Informe um e-mail válido.</span>
        }
      </div>

      <div class="field">
        <label>Senha</label>
        <div class="input-wrap">
          <input formControlName="senha"
                 [type]="senhaVisivel() ? 'text' : 'password'"
                 placeholder="Mínimo 6 caracteres"
                 [class.input-error]="invalido('senha')"/>
          <button type="button"
                  class="toggle-senha"
                  (click)="senhaVisivel.set(!senhaVisivel())">
            {{ senhaVisivel() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        @if (invalido('senha')) {
          <span class="field-error">A senha deve ter no mínimo 6 caracteres.</span>
        }
      </div>

      <button type="submit"
              class="login-btn"
              [disabled]="loading()">
        @if (loading()) { Criando conta... } @else { Criar conta }
      </button>

    </form>

    <div class="login-footer">
      Já tem conta?
      <a routerLink="/login" class="login-link">Entrar</a>
    </div>

  </div>
</div>
